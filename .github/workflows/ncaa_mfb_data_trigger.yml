name: ncaa-mfb-football-data trigger

# Every push to main wakes the sibling ncaa-mfb-football-data rebuild + publish via
# repository_dispatch, forwarding the head commit message. The data side parses
# the season range out of it with `Start:\s*\K[0-9]{4}` / `End:\s*\K[0-9]{4}`,
# anchored to the canonical "MFB Raw Update (Start: YYYY End: YYYY)" subject
# scripts/daily_mfb_scraper.sh writes (STARTING years) -- so embedded numbers
# elsewhere in a message cannot shadow the years. A push whose message has no such
# tokens (a code change) makes the data side fall back to the current season.
#
# The daily driver commits data + logs in ONE commit, so unlike nfl-ngs-raw there
# is no log-only push to gate out.
#
# `sha` pins the data side's raw.githubusercontent reads to this exact commit
# (`main` is CDN-cached for 5 minutes).
#
# Needs SDV_GH_TOKEN (org secret; a PAT with repo scope on the data repo) -- the
# default GITHUB_TOKEN cannot dispatch to another repo.

on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    # The payload is hardcoded to refs/heads/main, so a feature-branch or tag push
    # must not start a production build of work that has not landed
    # (cfbfastR-cfb-raw#10).
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger ncaa-mfb-football-data
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SDV_GH_TOKEN }}
          repository: sportsdataverse/ncaa-mfb-football-data
          event-type: daily_ncaa_mfb_data
          client-payload: |-
            {
              "ref": "refs/heads/main",
              "event_name": "daily_ncaa_mfb_data",
              "sha": "${{ github.sha }}",
              "commit_message": ${{ toJSON(github.event.head_commit.message) }}
            }
