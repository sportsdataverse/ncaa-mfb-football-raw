[project]
name = "ncaa-mfb-football-raw-scrape"
version = "0.1.0"
description = "stats.ncaa.org MFB raw-page capture + parse pipeline"
requires-python = ">=3.10"
dependencies = [
    "sportsdataverse",
    "polars>=1.0,<2.0",
    "pyarrow>=15.0",
    "beautifulsoup4>=4.12",
    # The NCAA browser transport needs it. sdv-py only declares it in its
    # `all` extra, which we do not install -- so an undeclared patchright is
    # removed by any venv rebuild and `uv sync --frozen` never puts it back.
    "patchright>=1.50",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# The parsers import sportsdataverse.cfb (cfb_ncaa_* engine), which lands on
# main ahead of PyPI.
[tool.uv.sources]
sportsdataverse = { git = "https://github.com/sportsdataverse/sportsdataverse-py", branch = "main" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E712"]
